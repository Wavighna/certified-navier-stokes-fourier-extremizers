[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extreme-flows"
version = "0.1.0"
description = "Reproducible search for persistent extreme growth in 3D incompressible flows"
requires-python = ">=3.12"
dependencies = [
  "jax[cpu]>=0.4.38",
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
proof = ["python-flint==0.9.0"]
symbolic = ["sympy==1.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
